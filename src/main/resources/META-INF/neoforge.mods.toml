modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''
Keeps NTM NEXT, NTM NEXT: Space and BuildCraft UNOFFICIAL machines and pipes running when no player is nearby.
Chunks with machines are held in memory without simulating mobs, crops or redstone, and only the machines are ticked.
Quarries, pumps, derricks, excavators and mining lasers also load their work area.
'''
authors = "BIGJOHN"
# Server-side only: clients without the mod can still join.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.2.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.2,26.3)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbm"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbmspace"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "buildcraftunofficial"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
